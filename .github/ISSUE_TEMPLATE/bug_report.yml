name: 问题反馈
description: 报告文件操作、界面或电脑状态读数问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 请先隐去截图、日志中的私人路径和文件名。不要上传整个 Data、账号凭据或私人文件；含敏感内容的问题请勿公开提交。
  - type: input
    id: version
    attributes:
      label: 文件坞版本
      description: 鼠标悬停顶部 RC 标识查看版本。
      placeholder: 例如 0.8.0-rc.5
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows 版本与使用环境
      placeholder: 例如 Windows 11 x64，本机显示器 / 远程桌面，多屏与缩放比例
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开程序开始，逐步说明操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 补充信息
      description: 可附脱敏截图。硬件读数问题请说明型号、对照工具和采样时刻；拖放问题请说明目标应用及操作方式。
