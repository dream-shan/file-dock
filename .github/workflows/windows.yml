name: Windows build and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Build, self-test and verify release package
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          ./源码/Verify-Repository.ps1
          ./源码/Release.ps1 -OutputDirectory "$env:RUNNER_TEMP/filedock-release"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: FileDock-win-x64
          path: |
            ${{ runner.temp }}/filedock-release/*.zip
            ${{ runner.temp }}/filedock-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-2025
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified workflow artifact and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download $env:RUN_ID --name FileDock-win-x64 --dir package
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed.' }
          $line = (Get-Content package/SHA256SUMS.txt -Raw).Trim() -split '\s+', 2
          $archive = Join-Path package $line[1]
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ine $line[0]) { throw 'Artifact checksum mismatch.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive).Path)
          try {
            $reader = [IO.StreamReader]::new($zip.GetEntry('build-info.json').Open())
            try { $manifest = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
            if ("v$($manifest.version)" -ne $env:RELEASE_TAG) { throw 'Release version mismatch.' }
            $reader = [IO.StreamReader]::new($zip.GetEntry('README.md').Open())
            try { $readme = $reader.ReadToEnd() } finally { $reader.Dispose() }
          } finally { $zip.Dispose() }
          $changes = [regex]::Match($readme, '(?ms)^## 本候选版变化\r?\n(.*?)(?=^## |\z)').Groups[1].Value.Trim()
          if (!$changes) { throw 'Candidate release notes missing from verified package.' }
          $body = @("# 文件坞 File Dock $env:RELEASE_TAG", '', $changes, '',
            'Windows x64：解压完整 ZIP 后运行 FileDock.exe；无需另装 .NET。',
            'CPU 温度组件需另行安装，步骤见包内 README.md；已有正常运行的服务本次无需重装。',
            '升级前退出旧版并备份 Data；旧 FileDockDemo.exe 改名和启动项迁移说明见 README.md。',
            '使用 SHA256SUMS.txt 核对 ZIP。主程序未作 Windows 代码签名，校验和不等同于签名。',
            "源码提交：$($manifest.commit)。build-info.json 包含逐文件哈希。") -join "`n"
          [IO.File]::WriteAllText((Join-Path $PWD 'release-notes.md'), $body, [Text.UTF8Encoding]::new($false))
          gh release create $env:RELEASE_TAG $archive package/SHA256SUMS.txt --verify-tag --prerelease --title "文件坞 File Dock $env:RELEASE_TAG" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed; no existing release assets were overwritten.' }
